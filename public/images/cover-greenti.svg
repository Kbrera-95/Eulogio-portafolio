    <linearGradient id="gt-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#C6F24E" stop-opacity="0.18"/>
